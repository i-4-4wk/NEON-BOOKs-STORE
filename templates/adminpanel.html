<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = 'stylesheet' href = "../static/style.css">
    <link rel = 'stylesheet' href = '../static/admin.css'>
    <title>NeonBooks</title>
  </head>
  <body>
    <header>
        <div class = "navbar">
           <a href ="/admin" class = "logo">N <span>Ξ</span> ON   BOOKS</a>
           <h>ADMIN <span>PANEL</span></h>
           </div>
    </header>

    <div class ='tabel'>
        <table>
         <thead>
            <tr>
                <th>#</th>
                <th>Client</th>
                <th>Phone</th>
                <th>Address</th>
                <th>Book</th>
                <th>Quantity</th>
                <th>Action</th>
            </tr>
         </thead>
         <tbody>
            {%for order in orders%}
             <tr>
               <td>{{order.id}}</td>
               <td>{{order.name}}</td>
               <td>{{order.number}}</td>
               <td>{{order.addr}}</td>
               <td>{{order.title}}</td>
               <td>{{order.quantity}}</td>
               <td><form method = 'POST' action ='/admin/panel'>
                     <input type ='hidden' name ='done' value = '{{order.id}}'>
                     <button type="submit" class="done-btn" onclick="return confirm('Mark order #{{ order.id }} as done?')">done</button>
                   </form>
              </td>
             </tr>
            {% endfor%}
         </tbody>
        </table>

    </div>

  </body>
</html>
